<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Portfolio de JACS Studio en mantenimiento. Próximamente disponible.">
    <title>En Mantenimiento | JACS Studio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Hanken+Grotesk:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        /* Estilos específicos para centrar la página de mantenimiento */
        .mantenimiento-contenedor {
            min-height: 80vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem 1.5rem;
        }
        .mantenimiento-imagen {
            max-width: 400px;
            width: 100%;
            height: auto;
            margin-bottom: 2rem;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
        }
        .mantenimiento-contenedor h1 {
            color: var(--acento-naranja);
            font-size: 2.5rem;
            margin-bottom: 1rem;
        }
        .mantenimiento-contenedor p {
            color: var(--texto-inverso-sec);
            font-size: 1.1rem;
            max-width: 45ch;
            margin-bottom: 2.5rem;
        }
    </style>
</head>

<body class="fondo-azul" id="top">
    <!-- Cabecera limpia con el logo -->
    <header class="cabecera-portfolio">
        <a href="index.html" aria-label="Volver a la página principal">
            <img src="images/logoprincipaljacs.svg" alt="JACS Studio" class="logo-portfolio">
        </a>
    </header>

    <main class="mantenimiento-contenedor">
        <!-- Reemplaza la ruta por la de tu propia imagen de mantenimiento -->
        <img src="images/blue-portail-with-sad-face-blue-monday-white-background.jpg" alt="Sección en mantenimiento" class="mantenimiento-imagen" width="600" height="400">
        
        <h1>Estamos mejorando el espacio</h1>
        <p>Pronto podrás ver aquí la nueva selección de proyectos. Mientras tanto, puedes volver al inicio o ponerte en contacto conmigo.</p>
        
        <a href="index.html" class="btn-naranja">Volver al Inicio</a>
    </main>

    <!-- Footer global -->
    <footer class="footer-global">
        <div class="footer__marca">
            <img src="images/logoprincipaljacs.svg" alt="JACS Diseño, 3D, Web" class="footer__logo-img" width="150" height="50" loading="lazy">
        </div>
        <small class="footer__copyright">
            &copy; 2026 José Antonio Cruz Segura. Todos los derechos reservados.
        </small>
    </footer>
</body>
</html>
